name: Deploy Services

on:
  push:
    branches:
      - main
      - staging
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      deploy_service:
        description: 'Service to Deploy'
        required: true
        default: 'both'
        type: choice
        options:
          - frontend
          - backend
          - both

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      target_env: ${{ steps.set-env.outputs.target_env }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect Changed Paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'packages/shared/**'
              - 'docker/Dockerfile.frontend'
              - 'package.json'
              - 'package-lock.json'
            backend:
              - 'backend/**'
              - 'packages/shared/**'
              - 'docker/Dockerfile.backend'
              - 'package.json'
              - 'package-lock.json'

      - name: Determine Deployment Environment
        id: set-env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "target_env=${{ github.event.inputs.target_env }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "target_env=production" >> "$GITHUB_OUTPUT"
          else
            echo "target_env=staging" >> "$GITHUB_OUTPUT"
          fi

  deploy-backend:
    needs: detect-changes
    if: >-
      (needs.detect-changes.outputs.backend == 'true' || github.event.inputs.deploy_service == 'backend' || github.event.inputs.deploy_service == 'both')
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.detect-changes.outputs.target_env }}
    steps:
      - name: Trigger Backend Webhook Deploy
        run: |
          echo "Deploying Backend to ${{ needs.detect-changes.outputs.target_env }}..."
          if [ -n "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}" ]; then
            curl -X POST "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}"
          else
            echo "RENDER_BACKEND_DEPLOY_HOOK not configured, skipping curl trigger."
          fi

  deploy-frontend:
    needs: detect-changes
    if: >-
      (needs.detect-changes.outputs.frontend == 'true' || github.event.inputs.deploy_service == 'frontend' || github.event.inputs.deploy_service == 'both')
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.detect-changes.outputs.target_env }}
    steps:
      - name: Trigger Frontend Webhook Deploy
        run: |
          echo "Deploying Frontend to ${{ needs.detect-changes.outputs.target_env }}..."
          if [ -n "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}" ]; then
            curl -X POST "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}"
          else
            echo "RENDER_FRONTEND_DEPLOY_HOOK not configured, skipping curl trigger."
          fi
