services:
  # ── 1. Backend Express Server ────────────────────────────
  - type: web
    name: qr-restaurant-server
    env: docker
    dockerfilePath: Dockerfile.server
    region: singapore
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: qr-restaurant-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: qr-restaurant-redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 7d
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        value: ssharma636076@gmail.com
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM_NAME
        value: EZ- Restaurant
      - key: SMTP_FROM_EMAIL
        value: ssharma636076@gmail.com
      - key: CLIENT_URL
        fromService:
          type: web
          name: qr-restaurant-web
          property: url

  # ── 2. Frontend Next.js Web ──────────────────────────────
  - type: web
    name: qr-restaurant-web
    env: docker
    dockerfilePath: Dockerfile.web
    region: singapore
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: qr-restaurant-server
          property: url
          envVarKey: RENDER_EXTERNAL_URL

databases:
  # ── 3. PostgreSQL Database ──────────────────────────────
  - name: qr-restaurant-db
    databaseName: qr_restaurant_db
    user: postgres
    region: singapore
    plan: free
